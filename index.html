<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kali Linux - Cyber Security Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kali-bg: #0d1117;
      --kali-dark: #090d12;
      --kali-blue: #1793d1;
      --kali-green: #00ff66;
      --kali-red: #ff3344;
      --kali-accent: #3399ff;
      --term-bg: rgba(13, 17, 23, 0.95);
      --font-code: 'Fira Code', monospace;
      --font-ar: 'Tajawal', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: var(--font-code);
      color: #fff;
    }

    /* Fullscreen CRT Scanline Overlay */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Screen 1: Main Intro Screen */
    #intro-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      background-color: #000;
    }

    #matrix-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.25;
      z-index: 1;
    }

    .intro-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .cyber-btn {
      position: relative;
      padding: 22px 60px;
      font-family: var(--font-ar);
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      background: #110000;
      border: 3px solid var(--kali-red);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 51, 68, 0.6), inset 0 0 15px rgba(255, 51, 68, 0.4);
      animation: pulseGlow 2s infinite ease-in-out;
      transition: all 0.2s ease;
      letter-spacing: 2px;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 51, 68, 0.6), inset 0 0 10px rgba(255, 51, 68, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 45px rgba(255, 51, 68, 0.9), inset 0 0 25px rgba(255, 51, 68, 0.7); transform: scale(1.03); }
    }

    .cyber-btn:hover {
      background: var(--kali-red);
      color: #000;
      box-shadow: 0 0 60px rgba(255, 51, 68, 1);
      animation: glitchHover 0.2s infinite;
    }

    @keyframes glitchHover {
      0% { transform: translate(0, 0) scale(1.05); }
      20% { transform: translate(-3px, 3px) scale(1.05); }
      40% { transform: translate(-3px, -3px) scale(1.05); }
      60% { transform: translate(3px, 3px) scale(1.05); }
      80% { transform: translate(3px, -3px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1.05); }
    }

    /* Glitch FX Canvas Overlay */
    #glitch-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loader-box {
      width: 320px;
      text-align: center;
    }

    .loader-text {
      font-size: 1.1rem;
      color: var(--kali-green);
      margin-bottom: 12px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--kali-green);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #111;
      border: 1px solid var(--kali-green);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--kali-green);
      box-shadow: 0 0 15px var(--kali-green);
      transition: width 0.1s linear;
    }

    /* Virtual Mouse Cursor */
    #virtual-cursor {
      position: fixed;
      top: 80%;
      left: 80%;
      width: 24px;
      height: 24px;
      z-index: 999;
      pointer-events: none;
      display: none;
      transition: transform 0.05s linear;
    }

    /* Screen 2: Kali Linux Desktop */
    #kali-desktop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0d14 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800"><path fill="%23131a26" d="M400,100 C200,100 100,250 100,450 C100,600 250,700 400,700 C550,700 700,600 700,450 C700,250 600,100 400,100 Z M380,200 L420,200 L450,350 L350,350 Z"/><circle cx="400" cy="400" r="280" fill="none" stroke="%2317202e" stroke-width="4"/></svg>') center/cover no-repeat;
      display: none;
      flex-direction: column;
      z-index: 5;
    }

    /* Top Bar Panel */
    .top-panel {
      height: 32px;
      background: rgba(15, 20, 28, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      font-size: 0.85rem;
      color: #bbb;
      z-index: 20;
    }

    .panel-left, .panel-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .kali-menu-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .kali-logo-icon {
      width: 18px;
      height: 18px;
      fill: var(--kali-blue);
    }

    .sys-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    .stat-bar {
      width: 40px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: var(--kali-blue);
      width: 45%;
    }

    /* Desktop Grid & Icons */
    .desktop-area {
      flex: 1;
      position: relative;
      padding: 20px;
    }

    .desktop-icon {
      width: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      position: absolute;
      transition: background 0.2s;
    }

    #kali-term-icon {
      top: 30px;
      left: 30px;
    }

    #msm-app-icon {
      top: 130px;
      left: 30px;
    }

    .desktop-icon:hover, .desktop-icon.active {
      background: rgba(23, 147, 209, 0.25);
      border: 1px solid rgba(23, 147, 209, 0.5);
    }

    #msm-app-icon:hover, #msm-app-icon.active {
      background: rgba(255, 51, 68, 0.25);
      border: 1px solid rgba(255, 51, 68, 0.5);
    }

    .icon-img {
      width: 48px;
      height: 48px;
      background: #111a24;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #223344;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .msm-icon-bg {
      background: #200005;
      border: 1px solid var(--kali-red);
      color: var(--kali-red);
      font-weight: 900;
      font-family: var(--font-ar);
    }

    .icon-label {
      font-size: 0.75rem;
      color: #eee;
      text-align: center;
      text-shadow: 0 1px 3px #000;
    }

    /* Generic Window Styles */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 80%;
      max-width: 900px;
      height: 520px;
      background: var(--term-bg);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 255, 102, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, width 0.4s ease;
      z-index: 30;
    }

    .window.active {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    .window-header {
      height: 34px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .window-title {
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
    }

    .win-close { background: #ff5f56; }
    .win-min { background: #ffbd2e; }
    .win-max { background: #27c93f; }

    /* Terminal Body */
    .terminal-body {
      flex: 1;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #00ff66;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
      font-family: var(--font-code);
    }

    .prompt-line {
      margin-bottom: 8px;
      word-break: break-all;
    }

    .user-part { color: #ff3344; font-weight: bold; }
    .path-part { color: #3399ff; font-weight: bold; }
    .output-text { color: #e6edf3; margin-bottom: 8px; white-space: pre-wrap; }
    .success-text { color: #00ff66; text-shadow: 0 0 5px rgba(0, 255, 102, 0.5); }

    /* Morse Output Box */
    .morse-card {
      margin-top: 15px;
      background: rgba(0, 255, 102, 0.05);
      border: 1px solid var(--kali-green);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
    }

    .morse-title {
      font-size: 0.75rem;
      color: var(--kali-green);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .morse-content {
      font-size: 1.25rem;
      color: #fff;
      letter-spacing: 4px;
      word-break: break-all;
      text-shadow: 0 0 8px var(--kali-green);
      font-weight: bold;
    }

    .copy-btn {
      align-self: flex-start;
      padding: 8px 18px;
      background: var(--kali-green);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: var(--font-code);
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #fff;
      box-shadow: 0 0 12px #fff;
    }

    /* MS.M App Window Styling */
    #msm-window {
      border: 1px solid var(--kali-red);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 25px rgba(255, 51, 68, 0.25);
      max-width: 650px;
      height: 560px;
    }

    .msm-body {
      flex: 1;
      background: #0a0203;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: var(--font-ar);
      direction: rtl;
      overflow-y: auto;
    }

    .msm-header-title {
      color: var(--kali-red);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.7);
      text-align: center;
    }

    .msm-sub {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .msm-input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .msm-input {
      width: 100%;
      padding: 12px 16px;
      background: #150507;
      border: 2px solid var(--kali-red);
      border-radius: 6px;
      color: #fff;
      font-family: var(--font-code);
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(255, 51, 68, 0.3);
    }

    .msm-input:focus {
      box-shadow: 0 0 15px rgba(255, 51, 68, 0.6), inset 0 0 8px rgba(255, 51, 68, 0.5);
    }

    .msm-submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--kali-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 51, 68, 0.4);
      transition: all 0.2s;
    }

    .msm-submit-btn:hover {
      background: #ff5566;
      box-shadow: 0 0 25px rgba(255, 51, 68, 0.8);
    }

    .msm-msg {
      font-size: 0.95rem;
      font-weight: bold;
      min-height: 24px;
      letter-spacing: 1px;
    }

    .msm-msg.denied { color: var(--kali-red); text-shadow: 0 0 8px var(--kali-red); }
    .msm-msg.granted { color: var(--kali-green); text-shadow: 0 0 8px var(--kali-green); }

    /* Mission Accomplished Card View */
    .mission-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .mission-title {
      font-size: 1.3rem;
      color: var(--kali-green);
      font-weight: 900;
      text-shadow: 0 0 10px var(--kali-green);
      letter-spacing: 1px;
      text-align: center;
    }

    .mission-img-container {
      width: 100%;
      max-width: 380px;
      border: 2px solid var(--kali-green);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
    }

    .mission-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .whatsapp-btn {
      padding: 14px 28px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-ar);
      font-weight: 900;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
      transition: all 0.2s;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .whatsapp-btn:hover {
      background: #20bd5a;
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.9);
      transform: scale(1.02);
    }

    /* Toast Notification */
    #toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--kali-green);
      color: #000;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 0 20px var(--kali-green);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10000;
    }

    #toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--kali-green);
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      .window {
        width: 95%;
        height: 80vh;
      }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>
  <div id="toast-msg">COPIED SUCCESSFULLY!</div>

  <!-- Screen 1: Intro Button -->
  <div id="intro-screen">
    <canvas id="matrix-canvas"></canvas>
    <div class="intro-content">
      <button class="cyber-btn" id="dont-click-btn">لا تضغط</button>
    </div>
  </div>

  <!-- Glitch & Loading Screen -->
  <div id="glitch-overlay">
    <div class="loader-box">
      <div class="loader-text" id="loader-status">INITIALIZING SYSTEM</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Virtual SVG Mouse Cursor -->
  <svg id="virtual-cursor" viewBox="0 0 24 24">
    <path fill="#ffffff" stroke="#000000" stroke-width="1.5" d="M4.5,2.5 L19.5,12.5 L12,14 L8.5,21.5 L4.5,2.5 Z"/>
  </svg>

  <!-- Screen 2: Kali Linux Desktop -->
  <div id="kali-desktop">
    <!-- Top Bar -->
    <div class="top-panel">
      <div class="panel-left">
        <div class="kali-menu-btn">
          <svg class="kali-logo-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          Applications
        </div>
        <span>System</span>
      </div>
      <div class="panel-right">
        <div class="sys-stat">
          <span>CPU</span>
          <div class="stat-bar"><div class="stat-fill" style="width: 28%;"></div></div>
        </div>
        <div class="sys-stat">
          <span>RAM</span>
          <div class="stat-bar"><div class="stat-fill" style="width: 62%;"></div></div>
        </div>
        <span id="clock-display">13:37</span>
      </div>
    </div>

    <!-- Desktop Icons -->
    <div class="desktop-area">
      <!-- Terminal Icon -->
      <div class="desktop-icon" id="kali-term-icon">
        <div class="icon-img">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
        <div class="icon-label">Terminal</div>
      </div>

      <!-- MS.M App Icon -->
      <div class="desktop-icon" id="msm-app-icon">
        <div class="icon-img msm-icon-bg">
          MS.M
        </div>
        <div class="icon-label">MS.M</div>
      </div>

      <!-- Kali Terminal Window -->
      <div class="window" id="term-window">
        <div class="window-header">
          <div class="window-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            root@kali:~
          </div>
          <div class="window-controls">
            <span class="win-btn win-min"></span>
            <span class="win-btn win-max"></span>
            <span class="win-btn win-close" id="term-close-btn"></span>
          </div>
        </div>
        <div class="terminal-body" id="term-body"></div>
      </div>

      <!-- MS.M App Window -->
      <div class="window" id="msm-window">
        <div class="window-header" style="border-bottom-color: rgba(255, 51, 68, 0.3);">
          <div class="window-title" style="color: var(--kali-red);">
            MS.M — RESTRICTED ACCESS
          </div>
          <div class="window-controls">
            <span class="win-btn win-close" id="msm-close-btn"></span>
          </div>
        </div>
        <div class="msm-body">
          <!-- Auth Form View -->
          <div id="msm-auth-view" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="msm-header-title">MS.M — RESTRICTED ACCESS</div>
            <div class="msm-sub">يرجى إدخال رمز الوصول لإكمال المهمة</div>
            <div class="msm-input-box">
              <input type="password" id="msm-pass-code" class="msm-input" placeholder="*****" maxlength="5">
              <button class="msm-submit-btn" id="msm-login-btn">تأكيد الدخول</button>
            </div>
            <div class="msm-msg" id="msm-status-msg"></div>
          </div>

          <!-- Mission Accomplished View -->
          <div class="mission-view" id="msm-mission-view">
            <div class="mission-title">MISSION COMPLETED SUCCESSFULLY ✅</div>
            <div class="mission-img-container">
              <img id="card-mission-img" src="https://i.postimg.cc/B6f8RJJ6/Carte-de-mission-cyberpunk-accomplie.png" alt="Carte de mission" class="mission-img">
            </div>
            <button id="send-report-btn" class="whatsapp-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.205 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
              </svg>
              SEND MISSION REPORT
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* Audio Effects Generator */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playBeep(freq = 800, type = 'sine', duration = 0.05) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }
      playGlitch() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e){}
      }
    }

    const sfx = new SoundFX();

    /* Matrix Background Animation */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ$%#@!*&';
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    /* Clock update */
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* DOM Elements */
    const dontClickBtn = document.getElementById('dont-click-btn');
    const introScreen = document.getElementById('intro-screen');
    const glitchOverlay = document.getElementById('glitch-overlay');
    const progressFill = document.getElementById('progress-fill');
    const virtualCursor = document.getElementById('virtual-cursor');
    const kaliDesktop = document.getElementById('kali-desktop');
    const kaliTermIcon = document.getElementById('kali-term-icon');
    const msmAppIcon = document.getElementById('msm-app-icon');
    const termWindow = document.getElementById('term-window');
    const msmWindow = document.getElementById('msm-window');
    const termBody = document.getElementById('term-body');
    const toastMsg = document.getElementById('toast-msg');

    const msmPassCode = document.getElementById('msm-pass-code');
    const msmLoginBtn = document.getElementById('msm-login-btn');
    const msmStatusMsg = document.getElementById('msm-status-msg');
    const msmAuthView = document.getElementById('msm-auth-view');
    const msmMissionView = document.getElementById('msm-mission-view');
    const sendReportBtn = document.getElementById('send-report-btn');

    /* Window Controls */
    document.getElementById('term-close-btn').addEventListener('click', () => {
      termWindow.classList.remove('active');
    });
    document.getElementById('msm-close-btn').addEventListener('click', () => {
      msmWindow.classList.remove('active');
    });

    kaliTermIcon.addEventListener('dblclick', () => {
      termWindow.classList.add('active');
    });

    msmAppIcon.addEventListener('click', () => {
      msmWindow.classList.add('active');
      msmPassCode.focus();
    });

    /* Hover Sound & FX on "Do Not Click" */
    dontClickBtn.addEventListener('mouseenter', () => {
      sfx.init();
      sfx.playGlitch();
    });

    /* Sequence Start */
    dontClickBtn.addEventListener('click', () => {
      sfx.init();
      sfx.playBeep(440, 'square', 0.2);

      introScreen.style.display = 'none';
      glitchOverlay.style.display = 'flex';

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 12) + 5;
        if (progress > 100) progress = 100;
        progressFill.style.width = progress + '%';
        sfx.playBeep(200 + progress * 5, 'sawtooth', 0.02);

        if (progress === 100) {
          clearInterval(interval);
          setTimeout(startVirtualMouseSequence, 400);
        }
      }, 80);
    });

    /* Virtual Mouse Animation Sequence */
    function startVirtualMouseSequence() {
      glitchOverlay.style.display = 'none';
      kaliDesktop.style.display = 'flex';
      virtualCursor.style.display = 'block';

      const iconRect = kaliTermIcon.getBoundingClientRect();
      const targetX = iconRect.left + iconRect.width / 2;
      const targetY = iconRect.top + iconRect.height / 2;

      let startX = window.innerWidth * 0.8;
      let startY = window.innerHeight * 0.8;

      virtualCursor.style.left = startX + 'px';
      virtualCursor.style.top = startY + 'px';

      let startTime = null;
      const duration = 1200;

      function animateMouse(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2;

        const currentX = startX + (targetX - startX) * easeProgress;
        const currentY = startY + (targetY - startY) * easeProgress;

        virtualCursor.style.left = currentX + 'px';
        virtualCursor.style.top = currentY + 'px';

        if (progress < 1) {
          requestAnimationFrame(animateMouse);
        } else {
          kaliTermIcon.classList.add('active');
          sfx.playBeep(1000, 'sine', 0.05);
          setTimeout(() => {
            sfx.playBeep(1200, 'sine', 0.05);
            virtualCursor.style.display = 'none';
            termWindow.classList.add('active');
            setTimeout(runTerminalScript, 500);
          }, 150);
        }
      }

      requestAnimationFrame(animateMouse);
    }

    /* Terminal Output Sequence */
    const terminalScript = [
      { type: 'cmd', text: 'clear' },
      { type: 'clear' },
      { type: 'cmd', text: 'echo "INITIALIZING SYSTEM..."' },
      { type: 'output', text: '[+] Establishing secure connection...\n[+] Loading encryption modules...\n[+] Scanning virtual environment...\n[+] Access granted.' },
      { type: 'cmd', text: 'morse --encode "-- .-. .-.-.- / --"' },
      { type: 'morse', text: '.---- ---.. ---.. ----. ..... / --. --- / - --- / - .... . / .- .--. .--. / -- ... .-.-.- -- / .- -. -.. / . -. - . .-. / - .... .. ... / -.-. --- -.. .' }
    ];

    function createPromptLine() {
      const line = document.createElement('div');
      line.className = 'prompt-line';
      line.innerHTML = `<span class="user-part">┌──(root</span><span class="user-part">㉿kali</span><span class="user-part">)-[</span><span class="path-part">~</span><span class="user-part">]</span><br><span class="user-part">└─# </span><span class="cmd-text"></span><span class="cursor-blink"></span>`;
      termBody.appendChild(line);
      termBody.scrollTop = termBody.scrollHeight;
      return line;
    }

    async function runTerminalScript() {
      for (const step of terminalScript) {
        if (step.type === 'clear') {
          termBody.innerHTML = '';
          await sleep(200);
          continue;
        }

        if (step.type === 'cmd') {
          const line = createPromptLine();
          const cmdTextSpan = line.querySelector('.cmd-text');
          const cursor = line.querySelector('.cursor-blink');

          for (let i = 0; i < step.text.length; i++) {
            cmdTextSpan.textContent += step.text[i];
            sfx.playBeep(600 + Math.random() * 200, 'square', 0.015);
            await sleep(40 + Math.random() * 30);
          }
          cursor.remove();
          await sleep(300);
        } else if (step.type === 'output') {
          const outDiv = document.createElement('div');
          outDiv.className = 'output-text success-text';
          outDiv.textContent = step.text;
          termBody.appendChild(outDiv);
          termBody.scrollTop = termBody.scrollHeight;
          await sleep(400);
        } else if (step.type === 'morse') {
          const morseCard = document.createElement('div');
          morseCard.className = 'morse-card';
          morseCard.innerHTML = `
            <div class="morse-title">ENCRYPTED MORSE CODE OUTPUT</div>
            <div class="morse-content" id="morse-text">${step.text}</div>
            <button class="copy-btn" id="copy-morse-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              COPY MORSE
            </button>
          `;
          termBody.appendChild(morseCard);
          termBody.scrollTop = termBody.scrollHeight;

          document.getElementById('copy-morse-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(step.text).then(() => {
              showToast();
              sfx.playBeep(1200, 'sine', 0.1);
            });
          });
        }
      }
    }

    /* MS.M Application Logic */
    function handleMsmAuth() {
      const code = msmPassCode.value.trim();
      if (code === '18895') {
        sfx.playBeep(1000, 'sine', 0.1);
        msmStatusMsg.className = 'msm-msg granted';
        msmStatusMsg.textContent = 'ACCESS GRANTED';

        setTimeout(() => {
          msmAuthView.style.display = 'none';
          msmMissionView.style.display = 'flex';
        }, 800);
      } else {
        sfx.playGlitch();
        msmStatusMsg.className = 'msm-msg denied';
        msmStatusMsg.textContent = 'ACCESS DENIED';
        msmPassCode.value = '';
        msmPassCode.focus();
      }
    }

    msmLoginBtn.addEventListener('click', handleMsmAuth);
    msmPassCode.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleMsmAuth();
    });

    /* WhatsApp Sending Logic */
    sendReportBtn.addEventListener('click', async () => {
      sfx.playBeep(1000, 'sine', 0.1);
      const phone = "212675459901";
      const message = "تم إنجاز المهمة بنجاح! ✅\nتم إكمال جميع مراحل المهمة بنجاح. 🎯";
      const waUrl = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;

      // Attempt native Web Share API with image file if supported
      try {
        const imgElement = document.getElementById('card-mission-img');
        const response = await fetch(imgElement.src);
        const blob = await response.blob();
        const file = new File([blob], 'Carte_de_mission_cyberpunk.png', { type: blob.type });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'MISSION COMPLETED',
            text: message,
            files: [file]
          });
          return;
        }
      } catch (err) {
        console.log("Web Share fallback triggered", err);
      }

      // Fallback: Direct redirect to WhatsApp chat with pre-filled message
      window.open(waUrl, '_blank');
    });

    function showToast() {
      toastMsg.classList.add('show');
      setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2500);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
